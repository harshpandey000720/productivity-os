# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/productivity_os
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#generate PostgreSQL-flavored SQL above line

jwt.secret=${JWT_SECRET}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql

#Custom AI Providers Config (Maps directly to your simplified AiProvidersProperties record)
ai.providers.priority=ollama,fallback

ai.providers.entries.ollama.type=ollama
ai.providers.entries.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ai.providers.entries.ollama.model=qwen3:4b-instruct-2507-q4_K_M
ai.providers.entries.ollama.timeout=120s
ai.providers.entries.ollama.temperature=0.0

ai.providers.entries.fallback.type=ollama
ai.providers.entries.fallback.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ai.providers.entries.fallback.model=llama3.2:3b
ai.providers.entries.fallback.timeout=60s
ai.providers.entries.fallback.temperature=0.0

# Custom Resilience Settings (Resilience hooks)
ai.providers.resilience.max-attempts=2
ai.providers.resilience.retry-backoff=300ms
ai.providers.resilience.breaker-window-size=4
ai.providers.resilience.breaker-minimum-calls=2
ai.providers.resilience.failure-rate-threshold=50
ai.providers.resilience.breaker-open-duration=30s

logging.level.dev.langchain4j=DEBUG